[package]
name = "godot-clean"
version = "0.2.1"
edition = "2024"
authors = ["Lis7ete"]
description = "A blazing-fast parallel CLI linter and cleanup tool for Godot projects"
repository = "https://github.com/Lis7ete/godot-clean"
license = "MIT"
keywords = ["godot", "gamedev", "linter", "cli", "cleanup"]
categories = ["command-line-utilities", "game-development"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
walkdir = "2.5"
regex = "1.10"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
